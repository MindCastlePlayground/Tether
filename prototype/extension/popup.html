<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tether — Browser access</title>
  <style>
    :root{color-scheme:light;--ink:#182c46;--teal:#007f82;--paper:#f3f8f9;--line:#d6e4e7;--muted:#526778}
    *{box-sizing:border-box}
    body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;width:380px;margin:0;padding:20px;color:var(--ink);background:var(--paper)}
    header{display:flex;align-items:center;gap:10px;padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
    header img{width:48px;height:48px;object-fit:contain}
    h1{font:700 27px/1.15 "Trebuchet MS","Segoe UI",sans-serif;letter-spacing:-1px;margin:0}
    header p{color:var(--muted);font-size:12px;margin:3px 0 0}
    h2{font-size:12px;font-weight:650;letter-spacing:.04em;margin:22px 0 6px;color:var(--muted)}
    .empty{color:var(--muted);padding:12px 0 16px;border-bottom:1px solid var(--line)}
    .card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;overflow-wrap:anywhere}
    label{display:flex;align-items:flex-start;gap:8px;font-weight:600}input{accent-color:var(--teal);margin-top:5px;flex-shrink:0}
    .label{font-size:12px;color:var(--muted);margin-bottom:5px}.url{font-weight:600;margin:5px 0 10px}
    button{border:1px solid transparent;border-radius:8px;padding:8px 11px;cursor:pointer;font:600 13px/1.4 "Segoe UI",sans-serif}
    button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
    .approve{background:var(--teal);color:white}.approve:hover{background:#00696c}
    .deny{background:#edf3f5;color:var(--ink);margin-left:6px}.deny:hover{border-color:#b8cdd3}
    .tab{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);margin:6px 0}
    .tab:hover{border-color:var(--teal)}
    .tab strong,.tab span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tab span{font-size:12px;color:var(--muted);margin-top:3px}.hint{font-size:12px;line-height:1.55;color:var(--muted);margin:8px 0}
    footer{font-size:11px;color:var(--muted);margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-128.png" alt="" width="48" height="48">
    <div><h1>Tether</h1><p>Your browser. Connected.</p></div>
  </header>
  <main id="items"><div class="empty">Checking for access requests…</div></main>
  <footer>Manage who can use your browser tabs.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
