<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tether — Browser access</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #14253d;
      --ink-secondary: #4a6074;
      --ink-muted: #526b7e;
      --on-teal: #ffffff;
      --teal: #007f82;
      --teal-ink: #007f82;
      --teal-hover: #00686b;
      --teal-active: #005456;
      --teal-subtle: #eef7f8;
      --teal-border: #9ec9cc;
      --paper: #f4f7f9;
      --surface: #ffffff;
      --surface-alt: #f8fafb;
      --surface-hover: #edf3f5;
      --line: #d8e4e8;
      --line-hover: #bcccd1;
      --line-subtle: #e9f0f3;
      --status-ok: #0a8754;
      --status-ok-bg: #edf8f2;
      --status-ok-border: #bce5ce;
      --status-warn: #b45309;
      --status-warn-ink: #78350f;
      --status-warn-bg: #fef7ec;
      --status-warn-border: #f8dfb4;
      --status-err: #b91c1c;
      --status-err-ink: #7f1d1d;
      --status-err-bg: #fdf2f2;
      --status-err-border: #f8c9c9;
      --status-off: #5a7082;
      --radius-sm: 4px;
      --radius-md: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2e8f0;
        --ink-secondary: #cbd5e1;
        --ink-muted: #94a3b8;
        --on-teal: #ffffff;
        --teal: #007f82;
        --teal-ink: #2eb8b8;
        --teal-hover: #00686b;
        --teal-active: #005456;
        --teal-subtle: #0f292e;
        --teal-border: #1e4e54;
        --paper: #0b131e;
        --surface: #111c2d;
        --surface-alt: #17263b;
        --surface-hover: #1e3148;
        --line: #23354d;
        --line-hover: #334b68;
        --line-subtle: #1a2a40;
        --status-ok: #10b981;
        --status-ok-bg: #0c2922;
        --status-ok-border: #154d3c;
        --status-warn: #f59e0b;
        --status-warn-ink: #fcd34d;
        --status-warn-bg: #291d0a;
        --status-warn-border: #523710;
        --status-err: #ef4444;
        --status-err-ink: #fca5a5;
        --status-err-bg: #2b1215;
        --status-err-border: #571f24;
        --status-off: #64748b;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      font: 13px/1.45 "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.2;
    }

    .tagline {
      font-size: 11px;
      color: var(--ink-muted);
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .auto-badge {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--status-warn);
      background: var(--status-warn-bg);
      border: 1px solid var(--status-warn-border);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .auto-badge[hidden] {
      display: none;
    }

    .lang-picker {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .lang-select {
      height: 24px;
      padding: 0 6px;
      font-size: 11px;
      font-family: inherit;
      color: var(--ink-secondary);
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    main {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 11px 12px;
      overflow-wrap: anywhere;
    }

    .panel-broker {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      min-width: 0;
    }

    .status-badge span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.ok { background: var(--status-ok); }
    .dot.warn { background: var(--status-warn); }
    .dot.err { background: var(--status-err); }
    .dot.off { background: var(--status-off); }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 2px;
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }

    .seg-btn {
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 8px;
      background: transparent;
      color: var(--ink-secondary);
      border: 1px solid transparent;
      border-radius: 3px;
    }

    .seg-btn:hover {
      color: var(--ink);
      background: var(--surface-hover);
    }

    .seg-btn[aria-checked="true"] {
      background: var(--teal);
      color: var(--on-teal);
      border-color: var(--teal);
    }

    .toggles-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--line-subtle);
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
    }

    .toggle-item input[type="checkbox"] {
      accent-color: var(--teal);
      width: 14px;
      height: 14px;
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-status {
      font-size: 11px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s ease, border-color 0.1s ease;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }

    .btn-approve {
      background: var(--teal);
      color: var(--on-teal);
      border-color: var(--teal);
    }
    .btn-approve:hover {
      background: var(--teal-hover);
      border-color: var(--teal-hover);
    }
    .btn-approve:active {
      background: var(--teal-active);
    }

    .btn-deny {
      background: var(--surface-alt);
      color: var(--ink);
      border-color: var(--line);
    }
    .btn-deny:hover {
      background: var(--surface-hover);
      border-color: var(--line-hover);
    }

    .btn-revoke {
      background: var(--surface);
      color: var(--ink-secondary);
      border-color: var(--line);
      font-size: 11px;
      padding: 4px 8px;
    }
    .btn-revoke:hover {
      color: var(--status-err);
      border-color: var(--status-err-border);
      background: var(--status-err-bg);
    }

    .btn-sm {
      font-size: 11.5px;
      padding: 5px 8px;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }

    .section-head-left, .section-head-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-secondary);
    }

    .section-badge {
      font-size: 11px;
      font-weight: 600;
      background: var(--line-subtle);
      color: var(--ink-secondary);
      padding: 1px 6px;
      border-radius: 10px;
    }

    .section-badge.highlight {
      background: var(--status-warn-bg);
      color: var(--status-warn);
      border: 1px solid var(--status-warn-border);
    }

    .empty {
      color: var(--ink-muted);
      font-size: 12px;
      padding: 10px 12px;
      background: var(--surface-alt);
      border: 1px dashed var(--line);
      border-radius: var(--radius-md);
      text-align: center;
    }

    .pending-card {
      border-color: var(--teal-border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .client-tag {
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink);
      background: var(--teal-subtle);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--teal-border);
    }

    .mode-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--teal-ink);
    }

    .item-side {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .countdown {
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);
    }

    .countdown.warn {
      color: var(--status-warn);
    }

    .countdown.expired {
      color: var(--status-err);
    }

    .pending-card.expired {
      opacity: 0.7;
    }

    .url-box {
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 11.5px;
      color: var(--ink);
      background: var(--surface-alt);
      border: 1px solid var(--line-subtle);
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      word-break: break-all;
    }

    .perm-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .perm-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      background: var(--surface-alt);
      border: 1px solid var(--line-subtle);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }

    .actions-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .session-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .session-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .session-client {
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink);
    }

    .session-duration {
      font-size: 11px;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .session-pages {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .page-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: 100%;
      text-align: left;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ink);
      background: var(--surface-alt);
      border: 1px solid var(--line-subtle);
      padding: 5px 7px;
      border-radius: var(--radius-sm);
    }

    button.page-row:hover {
      border-color: var(--teal-border);
      background: var(--teal-subtle);
    }

    .page-favicon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--teal-subtle);
      border: 1px solid var(--teal-border);
      color: var(--teal-ink);
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .page-title {
      color: var(--ink);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }

    .page-domain {
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 10.5px;
      color: var(--ink-muted);
      flex-shrink: 1;
      min-width: 0;
      max-width: 46%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .revoked-notice {
      font-size: 11px;
      font-weight: 600;
      color: var(--status-ok);
      background: var(--status-ok-bg);
      border: 1px solid var(--status-ok-border);
      padding: 2px 7px;
      border-radius: var(--radius-sm);
    }

    .tab-chooser {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--line-subtle);
    }

    .chooser-hint {
      font-size: 11px;
      color: var(--ink-secondary);
    }

    .chooser-empty {
      padding: 8px 10px;
    }

    .tab-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tab {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      cursor: pointer;
    }
    .tab:hover {
      border-color: var(--teal);
      background: var(--teal-subtle);
    }
    .tab-head {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .tab-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--teal-subtle);
      border: 1px solid var(--teal-border);
      color: var(--teal-ink);
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .tab-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }
    .tab-flag {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }
    .tab-flag.match {
      color: var(--teal-ink);
      background: var(--teal-subtle);
      border: 1px solid var(--teal-border);
    }
    .tab-flag.current {
      color: var(--status-ok);
      background: var(--status-ok-bg);
      border: 1px solid var(--status-ok-border);
    }
    .tab-url {
      display: block;
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    details.disclosure {
      font-size: 11px;
      color: var(--ink-muted);
    }

    details.disclosure summary {
      cursor: pointer;
      user-select: none;
      color: var(--ink-secondary);
      font-weight: 500;
    }
    details.disclosure summary:hover {
      color: var(--teal-ink);
    }

    .disclosure-body {
      padding: 6px 0 2px;
      line-height: 1.45;
      color: var(--ink-secondary);
    }

    .disclosure-body p + p {
      margin-top: 4px;
    }

    .alert-box {
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 11.5px;
      line-height: 1.45;
    }

    .alert-err {
      background: var(--status-err-bg);
      border: 1px solid var(--status-err-border);
      color: var(--status-err-ink);
    }

    .alert-warn {
      background: var(--status-warn-bg);
      border: 1px solid var(--status-warn-border);
      color: var(--status-warn-ink);
    }

    .alert-title {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .alert-detail {
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 10.5px;
      margin-top: 4px;
      opacity: 0.9;
      word-break: break-all;
    }

    .command-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .command {
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 10.5px;
      padding: 4px 6px;
      background: var(--surface);
      border: 1px solid currentColor;
      border-radius: var(--radius-sm);
      word-break: break-all;
    }

    .alert-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .btn-copy {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--line);
    }

    .btn-copy:hover {
      background: var(--surface-hover);
      border-color: var(--line-hover);
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--ink-muted);
      padding: 8px 14px 10px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .version {
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
      font-size: 11px;
      color: var(--ink-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon-128.png" alt="" width="22" height="22">
      <div class="brand-text">
        <h1>Tether</h1>
        <span class="tagline" data-i18n="tagline">Your browser. Connected.</span>
      </div>
    </div>
    <span id="auto-badge" class="auto-badge" data-i18n="autoApprovalBadge" hidden>Auto-approving</span>
  </header>
  <main id="items">
    <div class="empty" data-i18n="loading">Checking for access requests…</div>
  </main>
  <footer>
    <div class="lang-picker">
      <label for="language" class="sr-only" data-i18n="language">Language</label>
      <select id="language" class="lang-select">
        <option value="auto" data-i18n="auto">Follow browser</option>
        <option value="en" data-i18n="english">English</option>
        <option value="zh-CN" data-i18n="chinese">简体中文</option>
      </select>
    </div>
    <span id="version" class="version"></span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
