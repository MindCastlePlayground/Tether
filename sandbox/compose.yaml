services:
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: tether-sandbox:3.0.0
    container_name: tether-sandbox
    restart: unless-stopped
    init: true
    cpus: 2
    mem_limit: 2304m
    shm_size: 512m
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:18780:18780']
    volumes: ['sandbox-data:/data']
    environment:
      BB_BROWSER_WAKE: '0'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:18780/health']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
volumes:
  sandbox-data:
